name: benchline
version: "0.1.0"
author: Shaly
requires_hermes: ">=0.19.0"
description: >-
  Read-only local preflight for numeric lab-result CSV handoffs. Checks required fields,
  duplicate result keys, numeric formatting and exact units against a user-provided unit
  profile. Returns a bounded mechanical QC summary with row references, without identifiers,
  analyte/unit labels or measured values. No clinical interpretation, storage, writes or network.
provides_tools:
  - benchline_validate_csv
